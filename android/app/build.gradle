plugins { id 'com.android.application' }
android {
 namespace 'com.lyrnox.qingliao'
 compileSdk 35
 buildToolsVersion '35.0.0'
 ndkVersion '27.2.12479018'
 defaultConfig {
  applicationId 'com.lyrnox.qingliao'
  minSdk 26
  targetSdk 35
  versionCode 10
  versionName '0.1.9'
  testInstrumentationRunner 'com.lyrnox.qingliao.NativeInstrumentation'
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
  externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra -Werror' } }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 buildTypes { release { minifyEnabled false } }
 lint { abortOnError true }
}
dependencies {
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'io.github.webrtc-sdk:android:125.6422.07'
}
