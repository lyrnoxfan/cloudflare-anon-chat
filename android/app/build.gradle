plugins { id 'com.android.application' }
def javaStringLiteral = { value -> '"' + value.toString().replace('\\', '\\\\').replace('"', '\\"') + '"' }
def qaSfuEnabled = project.hasProperty('qaSfu')
def qaSfuBaseUrl = project.findProperty('qaSfuBaseUrl')?.toString()
def qaSfuTarget = project.findProperty('qaSfuTarget')?.toString()
if (qaSfuEnabled && (!qaSfuBaseUrl || !qaSfuTarget)) {
 throw new GradleException('Remote SFU QA requires -PqaSfuBaseUrl and -PqaSfuTarget for the isolated test environment')
}
android {
 namespace 'com.lyrnox.qingliao'
 testBuildType 'qa'
 compileSdk 35
 buildToolsVersion '35.0.0'
 ndkVersion '27.2.12479018'
 defaultConfig {
  applicationId 'com.lyrnox.qingliao'
  minSdk 26
  targetSdk 35
  versionCode 24
  versionName '0.3.3'
  testInstrumentationRunner (project.hasProperty('qaSfu') ? 'com.lyrnox.qingliao.RemoteSfuInstrumentation' : 'com.lyrnox.qingliao.NativeInstrumentation')
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
  externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra -Werror' } }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 buildFeatures { buildConfig true }
 buildTypes {
  debug { buildConfigField 'String', 'CHAT_BASE', '"https://chat.lyrnox.com"' }
  release { minifyEnabled false; buildConfigField 'String', 'CHAT_BASE', '"https://chat.lyrnox.com"' }
  qa {
   initWith debug
   applicationIdSuffix '.qa'
   versionNameSuffix '-qa'
   buildConfigField 'String', 'CHAT_BASE', (qaSfuEnabled ? javaStringLiteral(qaSfuBaseUrl) : '"http://127.0.0.1:8000"')
   buildConfigField 'String', 'QA_SFU_TARGET', (qaSfuEnabled ? javaStringLiteral(qaSfuTarget) : '"local-fixture"')
   matchingFallbacks = ['debug']
  }
 }
 lint { abortOnError true }
}
dependencies {
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'io.github.webrtc-sdk:android:125.6422.07'
}
