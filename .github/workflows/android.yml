name: Android QA APK
# Manual only: the QA applicationId is isolated from the installed production package.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17.0.14+7'
      - name: Install exact Android toolchain components
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build QA app, instrumentation APK and lint
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleQa :app:assembleQaAndroidTest :app:lintQa
          sha256sum app/build/outputs/apk/qa/app-qa.apk app/build/outputs/apk/androidTest/qa/app-qa-androidTest.apk > app/build/outputs/apk/qa/SHA256SUMS
      - name: Upload isolated QA APKs and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qingliao-qa-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/qa/app-qa.apk
            android/app/build/outputs/apk/androidTest/qa/app-qa-androidTest.apk
            android/app/build/outputs/apk/qa/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: Upload QA lint report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qingliao-qa-lint-${{ github.sha }}
          path: android/app/build/reports/lint-results-qa.*
          if-no-files-found: warn
          retention-days: 14
