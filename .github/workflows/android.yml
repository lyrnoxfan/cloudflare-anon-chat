name: Android consolidated acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17.0.14+7'
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked service dependencies
        working-directory: .
        run: |
          set -euo pipefail
          node --version
          test "$(node -p 'Number(process.versions.node.split(".")[0]) >= 22')" = true
          npm install --global pnpm@10.32.1
          pnpm install --frozen-lockfile
      - name: Exact Android toolchain and isolated emulator
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' 'emulator' 'system-images;android-29;default;x86_64'
      - name: Build matching Debug and QA apps, instrumentation and lint
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleQa assembleQaAndroidTest lintDebug lintQa
          mkdir -p evidence/ci
          git rev-parse HEAD > evidence/ci/source-commit.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/qa/app-qa.apk app/build/outputs/apk/androidTest/qa/app-qa-androidTest.apk > evidence/ci/SHA256SUMS
      - name: Native C++ ASan and UBSan
        run: |
          set -euo pipefail
          cmake -S android/app/src/main/cpp -B "$RUNNER_TEMP/native-qa" -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build "$RUNNER_TEMP/native-qa" -j2
          ctest --test-dir "$RUNNER_TEMP/native-qa" --output-on-failure | tee android/evidence/ci/native-host.txt
      - name: Android Activity, JNI and local real-service acceptance
        run: bash android/qa-fixture/ci-acceptance.sh
      - name: Upload exact APKs and acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qingliao-android-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/qa/app-qa.apk
            android/app/build/outputs/apk/androidTest/qa/app-qa-androidTest.apk
            android/evidence/ci/
            android/app/build/reports/lint-results-*.txt
          if-no-files-found: error
          retention-days: 7
