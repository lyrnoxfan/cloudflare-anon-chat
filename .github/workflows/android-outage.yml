name: Android packet-outage acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-outage
  cancel-in-progress: false
jobs:
  outage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      QA_CURRENT_SOURCE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Locked local Worker dependencies
        run: npm install --global pnpm@10.32.1 && pnpm install --frozen-lockfile
      - name: JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17.0.14+7'
      - name: Isolated Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" "emulator" "system-images;android-29;default;x86_64"'
      - name: Build source-bound candidate QA APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleQa
      - name: Actual packet interruption and native UI recovery
        run: bash android/qa-fixture/network-outage.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-outage-${{ github.sha }}
          path: android/evidence/outage/
          if-no-files-found: warn
          retention-days: 7
