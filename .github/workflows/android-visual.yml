name: Android isolated release upgrade acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download previously signed artifacts
        run: |
          set -euo pipefail
          mkdir -p input/new input/old
          gh run download 46126418982 -n qingliao-liaoji-signed-fb27f3b -D input/new
          gh release download android-v0.3.3-release-a92dd46 -p qingliao-android-0.3.3-release-a92dd46.apk -D input/old
          echo '1b3c2bbfb7d0ce5a5d6ac3dc717ccc85138bb1fe428ff4128833806e2f0d6f93  input/new/qingliao-liaoji-release-fb27f3b.apk' | sha256sum -c -
          echo '18bf1e466bc4fbd2e091aa898c957b216c5c6e62123ac9dc704e41b7d85cb66f  input/old/qingliao-android-0.3.3-release-a92dd46.apk' | sha256sum -c -
      - name: Install isolated emulator
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "emulator" "system-images;android-29;default;x86_64"'
      - name: Offline previous-to-new signed upgrade
        run: bash android/qa-fixture/release-upgrade-offline.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: upgrade-offline-${{ github.sha }}
          path: android/evidence/upgrade/
          if-no-files-found: warn
          retention-days: 7
