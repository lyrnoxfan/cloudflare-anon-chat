<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8faf3">
  <meta name="color-scheme" content="light dark">
  <title>轻聊 · 匿名聊天室</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <button class="drawer-backdrop" id="drawerBackdrop" aria-label="关闭导航菜单" tabindex="-1"></button>
  <div class="shell">
    <aside id="sidebar" aria-label="聊天室导航">
      <a class="brand" href="/" aria-label="轻聊首页"><span class="brand-mark" aria-hidden="true">●</span><span class="brand-name">轻聊</span><span class="brand-caption">随时聊两句</span></a>
      <div class="sidebar-section-label">聊天室</div>
      <button id="lobby" class="nav-item is-current" type="button"><span class="nav-icon" aria-hidden="true">⌂</span><span>公共大厅</span><span class="nav-chevron" aria-hidden="true">›</span></button>
      <button id="newRoom" class="nav-item" type="button"><span class="nav-icon" aria-hidden="true">＋</span><span>创建私人房间</span></button>
      <div class="sidebar-spacer"></div>

      <button id="rename" class="profile-button" type="button"><span class="profile-glyph" aria-hidden="true">☺</span><span class="profile-copy"><strong>修改昵称</strong><small>当前身份仅保存在会话中</small></span><span aria-hidden="true">›</span></button>
    </aside>
    <main>
      <header class="topbar">
        <button id="menuToggle" class="icon-button back-button" type="button" aria-label="返回房间导航" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5-7 7 7 7M7 12h14"/></svg></button>
        <span class="room-avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 18 0Z"/><path d="M7 10h8M7 14h5"/></svg></span><div class="room-heading"><div class="room-title-wrap"><div class="room-title-line"><h1 id="roomName">公共大厅</h1><button id="renameMobile" class="anonymous-tag" type="button" aria-label="匿名身份，修改昵称">匿名</button></div><div class="room-subtitle"><button id="count" type="button" aria-expanded="false" aria-controls="members">0 人在线</button><button id="roomCode" class="room-code" type="button" hidden title="复制房号"></button><span id="connection" class="connection connecting" role="status" aria-live="polite">正在连接…</span></div></div></div>
        <div class="top-actions"><button id="audioCall" class="icon-button" type="button" aria-label="发起语音通话" title="语音通话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a14 14 0 0 1-7-7l2-2-2-5Z"/></svg></button><button id="videoCall" class="icon-button" type="button" aria-label="发起视频通话" title="视频通话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="12" height="14" rx="3"/><path d="m15 10 6-4v12l-6-4"/></svg></button><button id="moreToggle" class="icon-button" type="button" aria-label="更多房间操作" aria-expanded="false" aria-controls="roomMore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
        <div id="roomMore" class="popover room-more" hidden><button id="share" type="button">复制房间链接</button><button id="createRoomMore" type="button">创建私人房间</button><button id="joinRoomMore" type="button">通过房号加入</button><button id="renameMore" type="button">修改昵称</button></div>
        <section class="memberbar" aria-label="在线成员"><div id="members" class="members-list"></div></section>
      </header>
      <div id="notice" role="status" aria-live="polite"></div>
      <section id="callPanel" class="call-panel" aria-label="通话面板" hidden>
        <div class="call-panel-heading"><div class="call-live-dot" aria-hidden="true"></div><div id="callInfo"></div></div>
        <div id="videos" aria-live="polite"></div>
        <div class="controls">
          <button id="acceptCall" type="button" class="call-control accept"><span aria-hidden="true">☎</span><span>接听 / 加入</span></button>
          <button id="declineCall" type="button" class="call-control secondary"><span aria-hidden="true">×</span><span>拒绝</span></button>
          <button id="mute" type="button" class="call-control secondary" hidden><span aria-hidden="true">♬</span><span>麦克风开</span></button>
          <button id="camera" type="button" class="call-control secondary" hidden><span aria-hidden="true">▣</span><span>摄像头开</span></button>
          <button id="flip" type="button" class="call-control secondary" hidden><span aria-hidden="true">⟳</span><span>切换镜头</span></button>
          <button id="hangup" type="button" class="call-control danger" hidden><span aria-hidden="true">☎</span><span>挂断</span></button>
        </div>
      </section>
      <section id="messages" aria-label="聊天消息" tabindex="0">
        <div class="history-tools"><button id="older" class="load-older" type="button" hidden>↑　加载更早消息</button></div>
        <div id="messageList" aria-live="off"></div>
        <div id="messageAnnouncements" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
        <div id="pending" class="pending-list" aria-live="polite"></div>
        <p id="empty" class="empty"><span class="empty-mark" aria-hidden="true">◌</span><strong>这里还很安静</strong><span>发一句话，开始今天的对话。</span></p>
      </section>
      <button id="unread" class="unread-pill" type="button" hidden>有新消息 · 回到底部 ↓</button>
      <section id="uploadStatus" class="upload-status" aria-live="polite" hidden></section>
      <section id="recorder" class="recorder" aria-label="语音录制控制" hidden><span class="record-indicator" aria-hidden="true"></span><span id="recordTime">00:00</span><audio id="recordPreview" controls hidden></audio><button id="stopRecord" type="button">停止</button><button id="sendRecord" type="button" hidden>发送语音</button><button id="cancelRecord" type="button" class="secondary">取消</button></section>
      <div id="replyDraft" class="reply-draft" hidden><div><small id="replyName"></small><p id="replyText"></p></div><button id="cancelReply" class="icon-button" aria-label="取消回复" type="button">×</button></div>
      <div class="composer-wrap"><div id="emojiPicker" class="emoji-picker popover" aria-label="选择表情" hidden></div><form id="composer" aria-label="发送消息">
        <label class="fileButton icon-button" tabindex="0" role="button" aria-label="上传图片、视频或文件" title="添加附件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><input id="file" type="file" hidden></label>
        <textarea id="messageText" rows="1" maxlength="4000" placeholder="说点什么…" aria-label="消息内容"></textarea>
        <button type="button" id="emojiToggle" class="icon-button" aria-label="选择表情" aria-expanded="false" aria-controls="emojiPicker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14s1 3 4 3 4-3 4-3M8 9h.01M16 9h.01"/></svg></button>
        <button type="button" id="record" class="icon-button" aria-label="录制语音" title="录制语音"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M9 22h6"/></svg></button>
        <button type="submit" id="send" class="icon-button" aria-label="发送消息" disabled hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 15-8-5 16-3-6-7-2Z"/><path d="m12 14 8-10"/></svg></button>
      </form></div>
      <footer hidden><span id="identity"></span></footer>
    </main>
  </div>
  <dialog id="joinRoomDialog" class="modal-dialog"><form id="joinRoomForm"><div class="eyebrow">加入私人房间</div><h2>通过房号加入</h2><label>房号<input id="joinRoomCode" type="text" maxlength="80" autocomplete="off" required></label><label>房间口令<input id="joinRoomPassword" type="password" maxlength="128" autocomplete="off" required></label><p id="joinRoomError" class="error" role="alert"></p><div class="dialog-actions"><button id="joinRoomCancel" type="button" class="secondary">取消</button><button type="submit" class="primary-action">加入房间</button></div></form></dialog>
  <dialog id="entry" class="modal-dialog"><form id="entryForm" method="dialog"><div class="dialog-symbol" aria-hidden="true">☺</div><div class="eyebrow">欢迎来到轻聊</div><h2>怎么称呼你？</h2><p>昵称不是账号，可以和别人重名。</p><label>昵称<input id="nickname" maxlength="32" required autocomplete="nickname"></label><p id="entryError" class="error" role="alert"></p><button type="submit" class="primary-action">进入聊天</button></form></dialog>
  <dialog id="private" class="modal-dialog"><form id="privateForm"><div class="dialog-symbol" aria-hidden="true">⌑</div><div class="eyebrow">仅凭口令进入</div><h2 id="privateTitle">创建私人房间</h2><label id="roomLabel">房间名称<input id="roomInput" maxlength="80" autocomplete="off"></label><label>房间口令<input id="password" type="password" maxlength="128" autocomplete="new-password" required></label><p id="privateError" class="error" role="alert"></p><div class="dialog-actions"><button id="privateCancel" type="button" class="secondary">取消</button><button type="submit" class="primary-action">继续</button></div></form></dialog>
  <dialog id="lightbox" class="lightbox-dialog"><button id="closeLightbox" class="icon-button lightbox-close" type="button" aria-label="关闭图片预览">×</button><img id="fullImage" alt="放大的聊天图片" hidden><video id="fullVideo" controls playsinline hidden></video></dialog>
  <div id="messageMenu" class="message-menu popover" role="menu" aria-label="消息操作" hidden><button id="copyMessage" role="menuitem" type="button">复制</button><button id="replyMessage" role="menuitem" type="button">回复</button><button id="deleteMessage" role="menuitem" type="button">删除</button></div>
  <dialog id="deleteDialog" class="modal-dialog"><h2>删除这条消息？</h2><p>删除后，房间里的所有人都将无法再查看这条消息。</p><div class="dialog-actions"><button id="cancelDelete" type="button">取消</button><button id="confirmDelete" type="button" class="primary-action">删除消息</button></div></dialog>
</body>
</html>
