<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1475df"><title>蓝间 · 匿名聊天室</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body><div class="shell"><aside><a class="brand" href="/">蓝间<span>ANONYMOUS CHAT</span></a><p class="intro">不必注册，<br>聊一会儿。</p><button id="lobby">公共大厅 <span>↗</span></button><button id="newRoom" class="secondary">创建私人房间</button><div class="aside-bottom"><p>没有账号，也没有预设身份。<br>请不要发送密码或敏感资料。</p><p>聊天记录保存在服务器。<br>这里不提供端到端加密。</p><button id="rename" class="subtle">修改昵称</button></div></aside><main><header><div><div class="eyebrow">此刻，在这里</div><h1 id="roomName">公共大厅</h1><span id="connection" role="status">正在连接…</span></div><button id="share" class="secondary">复制链接</button></header><section class="memberbar"><span id="count">0 人在线</span><div id="members"></div><div class="call-actions"><button id="audioCall" class="secondary">语音</button><button id="videoCall">视频通话</button></div></section><div id="notice" role="status" aria-live="polite"></div><section id="callPanel" class="call-panel" hidden><div id="callInfo"></div><div id="videos"></div><div class="controls"><button id="acceptCall">接听 / 加入</button><button id="declineCall" class="secondary">拒绝</button><button id="mute" class="secondary" hidden>麦克风开</button><button id="camera" class="secondary" hidden>摄像头开</button><button id="flip" class="secondary" hidden>切换镜头</button><button id="hangup" class="danger" hidden>挂断</button></div></section><section id="messages" aria-label="聊天消息" tabindex="0"><button id="older" class="subtle" hidden>加载更早消息</button><div id="messageList"></div><div id="pending"></div><p id="empty" class="empty">这里还很安静。<br><span>发一句话，开始今天的对话。</span></p></section><button id="unread" hidden>有新消息 · 回到底部 ↓</button><section id="uploadStatus" hidden></section><section id="recorder" hidden><span id="recordTime">00:00</span><audio id="recordPreview" controls hidden></audio><button id="stopRecord">停止</button><button id="sendRecord" hidden>发送语音</button><button id="cancelRecord" class="secondary">取消</button></section><form id="composer"><div class="tools"><label class="fileButton" tabindex="0" role="button" aria-label="上传图片、视频或文件">＋<input id="file" type="file" hidden></label><button type="button" id="record" class="secondary" aria-label="录制语音">录音</button></div><textarea id="messageText" rows="1" maxlength="4000" placeholder="说点什么…" aria-label="消息内容"></textarea><button type="submit" id="send">发送</button></form><footer><span><span id="identity"></span><button id="renameMobile" type="button">修改昵称</button></span><span>Shift + Enter 换行</span></footer></main></div><dialog id="entry"><form id="entryForm"><div class="eyebrow">欢迎来到蓝间</div><h2>怎么称呼你？</h2><p>昵称不是账号，可以和别人重名。</p><label>昵称<input id="nickname" maxlength="32" required autocomplete="nickname"></label><p id="entryError" class="error"></p><button>进入聊天</button></form></dialog><dialog id="private"><form id="privateForm"><div class="eyebrow">仅凭口令进入</div><h2 id="privateTitle">创建私人房间</h2><label id="roomLabel">房间名称<input id="roomInput" maxlength="80"></label><label>房间口令<input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label><p>至少 8 个字符。链接不能代替口令。</p><p id="privateError" class="error"></p><div class="row"><button id="privateCancel" type="button" class="secondary">取消</button><button>继续</button></div></form></dialog><dialog id="lightbox"><button id="closeLightbox" class="secondary">关闭</button><img id="fullImage" alt="放大的聊天图片" hidden><video id="fullVideo" controls playsinline hidden></video></dialog></body></html>
